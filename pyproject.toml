[project]
name = "llmforge"
version = "0.1.0"
description = "Evidence-driven LLM inference infrastructure and performance engineering toolkit"
readme = "README.md"
authors = [
    { name = "JJBlind" }
]
requires-python = ">=3.12,<3.13"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE"]

keywords = [
    "llm",
    "llm-inference",
    "ai-infrastructure",
    "cuda",
    "triton",
    "vllm",
    "sglang",
    "nccl",
    "gpu",
    "benchmarking",
    "performance-engineering",
    "observability",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/JJBlind-JGY/llmforge"
Repository = "https://github.com/JJBlind-JGY/llmforge"
Issues = "https://github.com/JJBlind-JGY/llmforge/issues"

[project.scripts]
llmforge-env = "llmforge.environment:main"

[project.optional-dependencies]
gpu = [
    "numpy>=2.0,<3; sys_platform == 'linux'",
    "torch==2.13.0; sys_platform == 'linux'",
]

serving = [
    "httpx>=0.28,<1",
]

observability = [
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]