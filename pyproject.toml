[project]
name = "llmforge"
version = "0.1.0"
description = "Production-oriented LLM inference infrastructure and performance engineering project"
readme = "README.md"
authors = [
    { name = "JJBlind", email = "jjblind@163.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
llmforge-env = "llmforge.environment:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
