[project]
name = "llmforge"
version = "0.1.0"
description = "Production-oriented LLM inference infrastructure and performance engineering project"
readme = "README.md"
authors = [
    { name = "JJBlind", email = "jjblind@163.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
llmforge-env = "llmforge.environment:main"

[project.optional-dependencies]
gpu = [
    "numpy>=2.0,<3; sys_platform == 'linux'",
    "torch==2.13.0; sys_platform == 'linux'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
