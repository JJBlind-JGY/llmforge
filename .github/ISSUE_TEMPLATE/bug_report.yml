name: Bug report
description: Report reproducible incorrect behavior in LLMForge.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide a minimal, reproducible case.

  - type: input
    id: commit
    attributes:
      label: Git commit
      description: Output of `git rev-parse HEAD` or the release tag.
      placeholder: d5889ba...
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 / Ubuntu 22.04 / ...
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.14"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Relevant environment
      description: |
        Include CUDA, PyTorch, vLLM, SGLang, or other versions when relevant.
      placeholder: |
        CUDA:
        PyTorch:
        vLLM:
        SGLang:
    validations:
      required: false

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Commands or code needed to reproduce the issue.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      description: Remove credentials and private machine information.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed secrets and private machine identifiers from logs.
          required: true
